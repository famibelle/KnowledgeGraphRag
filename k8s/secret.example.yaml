# ⚠️ MODÈLE — NE PAS REMPLIR CE FICHIER, il est suivi par git.
#
# Voie recommandée : créer le Secret en ligne de commande, hors du dépôt.
#
#   kubectl -n graphrag create secret generic graphrag-secrets \
#     --from-literal=OPENAI_API_KEY='sk-...' \
#     --from-literal=NEO4J_PASSWORD='...'
#
# Sinon : copier ce fichier en k8s/secret.yaml (ignoré par .gitignore), y mettre les
# vraies valeurs, puis `kubectl apply -f k8s/secret.yaml`.
#
# En production, préférez un gestionnaire externe (Azure Key Vault via le pilote CSI,
# External Secrets Operator, Sealed Secrets) : un Secret Kubernetes n'est qu'un base64,
# lisible par quiconque peut décrire l'objet.
apiVersion: v1
kind: Secret
metadata:
  name: graphrag-secrets
  namespace: graphrag
  labels:
    app.kubernetes.io/name: graphrag
type: Opaque
stringData:
  OPENAI_API_KEY: "REMPLACER"
  NEO4J_PASSWORD: "REMPLACER"
